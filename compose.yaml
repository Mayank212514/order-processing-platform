
services:
  postgres:
    image: postgres:17
    container_name: order-postgres
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orderpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderuser -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build: .
    container_name: order-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orderdb
      DB_USERNAME: orderuser
      DB_PASSWORD: ${DB_PASSWORD:-orderpass}
    ports:
      - "8080:8080"
  
  analytics-service:
    build: ./analytics-service
    container_name: order-analytics
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: orderdb
      DB_USER: orderuser
      DB_PASSWORD: ${DB_PASSWORD:-orderpass}
    ports:
      - "8000:8000"    

volumes:
  postgres_data:
    external: true
    name: "4e12edb12918d568e658eeaea30fc316c044e91faef34d23b7e5c41c86925f84"
