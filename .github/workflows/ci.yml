
name: Order Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java-tests:
    name: Java Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: orderdb_test
          POSTGRES_USER: orderuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderuser -d orderdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Spring Boot tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/orderdb_test
          DB_USERNAME: orderuser
          DB_PASSWORD: testpass
        run: ./mvnw test

  python-check:
    name: Python Analytics Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: analytics-service
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        working-directory: analytics-service
        run: python -m compileall -q main.py database.py
